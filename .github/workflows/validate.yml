name: Validate plugin release

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate manifests, skills, changelog, and version bump
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/validate_plugin_release.py --base-ref "$BASE_REF"
